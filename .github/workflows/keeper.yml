name: Keeper

# Settles every lease whose deadline has passed, every 5 minutes (the shortest GitHub allows).
# The app also settles a lease as soon as anyone opens its page, and Vercel's daily cron is a
# last resort. Set two repository secrets: KEEPER_URL (e.g. https://tinco.vercel.app) and
# CRON_SECRET (the same value as in Vercel). Without KEEPER_URL the job does nothing.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the keeper
        env:
          KEEPER_URL: ${{ secrets.KEEPER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KEEPER_URL" ]; then echo "KEEPER_URL is not set, skipping."; exit 0; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$KEEPER_URL/api/keeper"
